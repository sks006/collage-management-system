groups:
  - name: sms_alerts
    rules:
      - alert: HighOutboxFailureRate
        expr: rate(outbox_events_failed_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Transactional Outbox events failing at high rate"
          description: "More than 5% of outbox events are failing over the last 5 minutes."

      - alert: FastifyApiErrorSpike
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.02
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx error rate above 2%"
